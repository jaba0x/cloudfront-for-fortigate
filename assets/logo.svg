<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="FrontGate logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16263f"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14a597"/>
    </linearGradient>
  </defs>
  <style>
    .pkt  { fill: #ffd35a; opacity: 0; animation: pass 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    .p2   { animation-delay: .8s; }
    .p3   { animation-delay: 1.6s; }
    .glow { fill: none; stroke: #8ff7e8; stroke-width: 3; stroke-linejoin: round; opacity: 0; animation: glow .8s ease-out infinite; animation-delay: .1s; }
    @keyframes pass {
      0%   { transform: translateY(0);     opacity: 0; }
      15%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(112px); opacity: 0; }
    }
    @keyframes glow {
      0%   { opacity: 0; }
      40%  { opacity: .9; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pkt, .glow { animation: none; }
      .pkt  { opacity: 1; }
      .p2   { transform: translateY(58px); }
      .p3   { transform: translateY(100px); }
    }
  </style>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- cloud -->
  <g fill="url(#cloud)">
    <circle cx="98" cy="86" r="18"/>
    <circle cx="128" cy="70" r="26"/>
    <circle cx="158" cy="86" r="18"/>
    <rect x="80" y="86" width="96" height="18" rx="9"/>
  </g>

  <!-- gate -->
  <path d="M72 222V168a56 56 0 0 1 112 0V222h-28V170a28 28 0 0 0-56 0V222z" fill="url(#gate)"/>
  <path class="glow" d="M72 222V168a56 56 0 0 1 112 0V222h-28V170a28 28 0 0 0-56 0V222z"/>
  <rect x="56" y="222" width="144" height="8" rx="4" fill="#2dd4bf" opacity=".55"/>

  <!-- packets passing through -->
  <circle class="pkt"    cx="112" cy="108" r="6"/>
  <circle class="pkt p2" cx="128" cy="108" r="6"/>
  <circle class="pkt p3" cx="144" cy="108" r="6"/>
</svg>
